[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: fits models using SVI or MCMC"]

[project]
name = "dynamirt"
version = "0.1.0"
authors = [
  { name="Jonas Kupschus", email="jonas.kupschus@rwth-aachen.de" },
]
description = "Static and Longitudinal Multidimensional Item Response Theory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "jax",
    "numpyro",
    "arviz>=1",
    "matplotlib",
    "tinygp",
    "xarray>=2024.10.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.git.nrw/jkupschus/dynamirt"
